[project]
name = "voice-agent"
version = "0.1.0"
description = "Real-time voice agent: Deepgram STT -> Claude on Bedrock -> TTS (Pipecat)"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[anthropic,aws,deepgram,runner,silero,webrtc]>=1.12,<2",
    "aiohttp",
    "asyncpg",
    "python-dotenv",
]

[tool.uv]
package = false

[tool.ruff]
# Underscore scripts are one-off experiments (latency/smoke tests), not part of the bot.
extend-exclude = ["_*.py"]
