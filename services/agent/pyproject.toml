[project]
name = "voice-agent"
version = "0.1.0"
description = "Real-time voice agent: Deepgram STT -> Claude on Bedrock -> TTS (Pipecat)"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[anthropic,aws,deepgram,runner,silero,webrtc]>=1.12,<2",
    "aiohttp",
    "asyncpg",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# The source is mounted read-only in compose.
addopts = "-p no:cacheprovider"

[tool.ruff]
# Underscore scripts are one-off experiments (latency/smoke tests), not part of the bot.
extend-exclude = ["_*.py"]
